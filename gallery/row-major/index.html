    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
        <h2 id="lightbox-title" class="visually-hidden">Gallery image preview</h2>
        <button type="button" class="lightbox-close" aria-label="Close image preview">&times;</button>
        <img id="lightbox-img" alt="">
    </div>

    <script>
        const gallery = document.querySelector('.gallery-container');
        const galleryItems = Array.from(gallery.querySelectorAll('.gallery-item'));
        let galleryLayoutFrame = null;

        function layoutGallery() {
            const styles = getComputedStyle(gallery);
            const rowHeight = parseFloat(styles.gridAutoRows);
            const rowGap = parseFloat(styles.rowGap);

            galleryItems.forEach(item => {
                const image = item.querySelector('img');
                const sourceWidth = image.naturalWidth || Number(image.getAttribute('width'));
                const sourceHeight = image.naturalHeight || Number(image.getAttribute('height'));
                if (!sourceWidth || !sourceHeight) return;

                const renderedHeight = item.clientWidth * (sourceHeight / sourceWidth);
                const rowSpan = Math.ceil((renderedHeight + rowGap) / (rowHeight + rowGap));
                item.style.gridRowEnd = `span ${rowSpan}`;
            });

            galleryLayoutFrame = null;
        }

        function scheduleGalleryLayout() {
            if (galleryLayoutFrame !== null) cancelAnimationFrame(galleryLayoutFrame);
            galleryLayoutFrame = requestAnimationFrame(layoutGallery);
        }

        galleryItems.forEach(item => {
            const image = item.querySelector('img');
            if (image.complete) {
                scheduleGalleryLayout();
            } else {
                image.addEventListener('load', scheduleGalleryLayout, { once: true });
            }
        });

        window.addEventListener('resize', scheduleGalleryLayout, { passive: true });

        let lightboxTrigger = null;

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            lightboxTrigger = document.activeElement;

            // Fix for relative path issue since gallery is in a subdirectory
            if (!src.startsWith('../../') && !src.startsWith('http')) {
                src = '../../' + src;
            }

            img.src = src;
            img.alt = lightboxTrigger?.querySelector('img')?.alt || 'Enlarged gallery image';
            lightbox.hidden = false;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            lightbox.querySelector('.lightbox-close').focus();
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            lightbox.hidden = true;
            document.body.style.overflow = '';
            const img = document.getElementById('lightbox-img');
            img.removeAttribute('src');
            img.alt = '';

            if (lightboxTrigger instanceof HTMLElement) {
                lightboxTrigger.focus();
            }
        }

        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');

            if (!lightbox.hidden && e.key === 'Escape') {
                closeLightbox();
            }

            if (!lightbox.hidden && e.key === 'Tab') {
                e.preventDefault();
                lightbox.querySelector('.lightbox-close').focus();
            }
        });
    </script>

</body>

</html>
